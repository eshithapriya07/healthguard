<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Minimal font configuration for rendering PlantUML diagrams inside the
     sandbox (the fonts were unpacked from the Ubuntu packages into tools/gui). -->
<fontconfig>
  <dir>/workspace/chats/186c05949e9974462f5b5369/tools/gui/usr/share/fonts</dir>
  <cachedir>/workspace/chats/186c05949e9974462f5b5369/tools/gui/fontcache</cachedir>
  <match target="pattern">
    <test name="family" qual="any"><string>sans-serif</string></test>
    <edit name="family" mode="append" binding="weak"><string>DejaVu Sans</string></edit>
  </match>
</fontconfig>
